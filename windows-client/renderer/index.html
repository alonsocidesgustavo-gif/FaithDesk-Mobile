<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FaithDesk Mobile</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#0f1117;color:#f1f5f9;font-family:Segoe UI,Arial,sans-serif}
    .wrap{min-height:100vh;display:grid;place-items:center;padding:32px}
    .card{width:min(720px,100%);background:#1e2130;border:1px solid #334155;border-radius:18px;padding:32px}
    h1{margin:0 0 8px;font-size:28px}.muted{color:#94a3b8}.status{margin-top:24px;padding:16px;border-radius:12px;background:#1a1d27}
    .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#22c55e;margin-right:8px}
  </style>
</head>
<body>
  <main class="wrap"><section class="card">
    <h1>FaithDesk Mobile</h1>
    <div class="muted">Cliente Windows</div>
    <div class="status"><span class="dot"></span>Aplicativo iniciado</div>
  </section></main>
</body>
</html>
